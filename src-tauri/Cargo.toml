[package]
name = "leakscope"
version = "0.1.0"
description = "LeakScope — Scan GitHub repos for leaked secrets"
authors = ["LeakScope <hello@leakscope.com>"]
edition = "2021"

[features]
default = []
pro = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
dirs = "5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
regex = "1"
chrono = "0.4"
lazy_static = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
